## 解決方法

````php
<?php
if ($_POST['grade'] !== '') {
    // 文字列を整数に変換
    $grade = (int)$_POST['grade'];
    
    // または
    $grade = intval($_POST['grade']);
    
    // データベース更新の例
    $sql = "UPDATE student SET grade = :grade WHERE id = :id";
    $stmt = $db->prepare($sql);
    $stmt->bindValue(':grade', $grade, PDO::PARAM_INT);
    $stmt->bindValue(':id', $student_id, PDO::PARAM_INT);
    $stmt->execute();
} else {
    // 学年が選択されていない場合の処理
    echo "学年を選択してください。";
}
?>
````

## 主なポイント

1. **型変換**: `(int)$_POST['grade']` または `intval($_POST['grade'])`
2. **バリデーション**: 空文字チェック
3. **PDOバインド**: `PDO::PARAM_INT`を使用

## より安全な方法

````php
<?php
if (isset($_POST['grade']) && $_POST['grade'] !== '') {
    $grade = filter_var($_POST['grade'], FILTER_VALIDATE_INT);
    
    if ($grade !== false && $grade >= 1 && $grade <= 3) {
        // 有効な学年（1-3）の場合のみ処理
        $sql = "UPDATE student SET grade = :grade WHERE id = :id";
        $stmt = $db->prepare($sql);
        $stmt->bindValue(':grade', $grade, PDO::PARAM_INT);
        $stmt->bindValue(':id', $student_id, PDO::PARAM_INT);
        $stmt->execute();
    } else {
        echo "無効な学年です。";
    }
} else {
    echo "学年を選択してください。";
}
?>
````

**`filter_var()`を使用する利点:**
- より厳密な検証
- 無効な値（文字列など）を適切に処理
- セキュリティ向上


## `filter_var()`関数とは

`filter_var()`は、PHPの**データフィルタリング・検証関数**です。
入力データが期待する形式かどうかをチェックし、
安全に処理するために使用します。

## 基本的な使い方

````php
$result = filter_var($value, $filter, $options);
````

- `$value`: 検証したい値
- `$filter`: フィルターの種類
- `$options`: オプション（省略可能）

## `FILTER_VALIDATE_INT`の動作

````php
<?php
// 例1: 有効な整数文字列
$input = "123";
$result = filter_var($input, FILTER_VALIDATE_INT);
var_dump($result); // int(123)

// 例2: 無効な値（文字列）
$input = "abc";
$result = filter_var($input, FILTER_VALIDATE_INT);
var_dump($result); // bool(false) bool型のfalseが返される

// 例3: 空文字
$input = "";
$result = filter_var($input, FILTER_VALIDATE_INT);
var_dump($result); // bool(false) bool型のfalseが返される
?>
````

## 実際の使用例

````php
<?php
// POSTデータの検証
if (isset($_POST['grade'])) {
    $grade = filter_var($_POST['grade'], FILTER_VALIDATE_INT);
    
    if ($grade !== false) {
        echo "有効な整数: " . $grade;
        // データベース処理など
    } else {
        echo "無効な値です";
    }
}
?>
````

## 他の型変換方法との比較

````php
<?php
$input = "123abc"; // 無効な値

// (int)での型変換
$result1 = (int)$input;
echo $result1; // 123 (一部だけ変換される)

// filter_var()での検証
$result2 = filter_var($input, FILTER_VALIDATE_INT);
var_dump($result2); // bool(false) (厳密にチェック)
?>
````

## 範囲指定オプション

````php
<?php
// 1から3の範囲で検証
$options = array(
    "options" => array(
        "min_range" => 1,
        "max_range" => 3
    )
);

$grade = filter_var($_POST['grade'], FILTER_VALIDATE_INT, $options);

if ($grade !== false) {
    echo "有効な学年: " . $grade;
} else {
    echo "1-3の範囲で入力してください";
}
?>
````

## なぜ`filter_var()`を使うべきか

- **厳密な検証**: 完全に整数でない値は`false`を返す
- **セキュリティ**: 予期しない値を確実に排除
- **可読性**: コードの意図が明確 -->
